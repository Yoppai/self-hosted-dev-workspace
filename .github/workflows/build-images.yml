# .github/workflows/build-images.yml
# Self-Hosted Workspace — ARM64 Image Build, Validate, Promote & Deploy
# =====================================================================
# Main CI workflow that cross-builds ARM64 images via QEMU + buildx on
# GitHub-hosted ubuntu-latest runners, validates, promotes, and deploys
# all workspace Docker images to GHCR.
#
# CRITICAL DESIGN RULE: Images are NEVER published with `latest` or
# version tags before validation. Build jobs push only immutable
# sha-<short> tags to GHCR. A separate promote-images job runs only after
# validate succeeds (main branch only) and uses `buildx imagetools create`
# to attach `latest` and version tags — no layer re-push.
#
# Registry handoff:
#   1. Build jobs → push sha-<short> tags only (immutable, private to run)
#   2. Validate job → pull sha tags from GHCR, verify arch, smoke check
#   3. Promote job → add latest + version tags via imagetools create
#   4. Notify Dokploy → trigger deploy webhook
#
# Job dependency graph:
#   changes (paths-filter)
#     ├── build-dev-base ─┬─ build-opencode ─┐
#     │                   ├─ build-codenomad ─┤
#     ├── build-kasmvnc ──┘                   ├─ validate ── promote-images ── notify-dokploy
#     └─ (build-all flag)                     ┘
#
# Triggers:
#   - push:main (path-filtered by Dockerfile directory)
#   - pull_request (path-filtered; builds/validates only, no promotion)
#   - workflow_dispatch (manual, optional no-cache)
#   - schedule (Monday 03:00 UTC, no-cache, picks up OS patches)
#
# Environment:
#   - runs-on: ubuntu-latest (cross-build ARM64 via QEMU)
#   - GHCR auth via GITHUB_TOKEN (permissions.packages: write)
#   - Dokploy Compose webhook via secrets.DOKPLOY_WEBHOOK_URL

name: Build Images

on:
  push:
    branches:
      - main
    paths:
      - 'dev-base/**'
      - 'opencode/**'
      - 'codenomad/**'
      - 'kasmvnc/**'
      - '.github/workflows/build-images.yml'
      - '.github/actions/docker-build-push/**'
  pull_request:
    branches:
      - main
    paths:
      - 'dev-base/**'
      - 'opencode/**'
      - 'codenomad/**'
      - 'kasmvnc/**'
      - '.github/workflows/build-images.yml'
      - '.github/actions/docker-build-push/**'
  workflow_dispatch:
    inputs:
      no-cache:
        description: 'Rebuild all images from scratch (no cache)'
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 03:00 UTC — weekly no-cache rebuild picks up OS security patches
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: yoppai

jobs:
  # ── Job: Change detection (paths-filter) ──────────────────────────────────
  # Determines which images need rebuilding on push/PR events.
  # On schedule and workflow_dispatch: ALL images are rebuilt regardless.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dev-base: ${{ steps.filter.outputs.dev-base }}
      opencode: ${{ steps.filter.outputs.opencode }}
      codenomad: ${{ steps.filter.outputs.codenomad }}
      kasmvnc: ${{ steps.filter.outputs.kasmvnc }}
      ci: ${{ steps.filter.outputs.ci }}
      build-all: ${{ steps.build-all.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev-base:
              - 'dev-base/**'
            opencode:
              - 'opencode/**'
            codenomad:
              - 'codenomad/**'
            kasmvnc:
              - 'kasmvnc/**'
            ci:
              - '.github/workflows/build-images.yml'
              - '.github/actions/docker-build-push/**'

      - name: Determine build-all flag
        id: build-all
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.filter.outputs.ci }}" == "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Job: Build dev-base (dependency for opencode + codenomad) ────────────
  # Only builds when:
  #   - build-all is true (schedule / workflow_dispatch), OR
  #   - dev-base/, opencode/, or codenomad/ files changed on push/PR
  # Pushes only immutable sha-<short> tag to GHCR (no latest/version tags).
  build-dev-base:
    name: Build dev-base
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: changes
    if: |
      needs.changes.outputs.build-all == 'true' ||
      needs.changes.outputs.dev-base == 'true' ||
      needs.changes.outputs.opencode == 'true' ||
      needs.changes.outputs.codenomad == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and push dev-base (sha tag only)
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile_path: dev-base/Dockerfile
          image_name: dev-base
          build_context: ./dev-base
          push: true
          include-latest-tag: false
          include-version-tags: false
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.no-cache == 'true') || 'false' }}

  # ── Job: Build kasmvnc (independent — no dev-base dependency) ────────────
  build-kasmvnc:
    name: Build kasmvnc
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: changes
    if: |
      needs.changes.outputs.build-all == 'true' ||
      needs.changes.outputs.kasmvnc == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and push kasmvnc-workspace (sha tag only)
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile_path: kasmvnc/Dockerfile
          image_name: kasmvnc-workspace
          build_context: ./kasmvnc
          push: true
          include-latest-tag: false
          include-version-tags: false
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.no-cache == 'true') || 'false' }}

  # ── Job: Build opencode-server (needs dev-base) ──────────────────────────
  build-opencode:
    name: Build opencode-server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [changes, build-dev-base]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve short SHA
        id: short-sha
        shell: bash
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push opencode-server (sha tag only)
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile_path: opencode/Dockerfile
          image_name: opencode-server
          build_context: ./opencode
          push: true
          include-latest-tag: false
          include-version-tags: false
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-contexts: |
            dev-base:latest=docker-image://ghcr.io/${{ env.GHCR_OWNER }}/dev-base:sha-${{ steps.short-sha.outputs.value }}
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.no-cache == 'true') || 'false' }}

  # ── Job: Build codenomad-server (needs dev-base) ─────────────────────────
  build-codenomad:
    name: Build codenomad-server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [changes, build-dev-base]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve short SHA
        id: short-sha
        shell: bash
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push codenomad-server (sha tag only)
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile_path: codenomad/Dockerfile
          image_name: codenomad-server
          build_context: ./codenomad
          push: true
          include-latest-tag: false
          include-version-tags: false
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-contexts: |
            dev-base:latest=docker-image://ghcr.io/${{ env.GHCR_OWNER }}/dev-base:sha-${{ steps.short-sha.outputs.value }}
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.no-cache == 'true') || 'false' }}

  # ── Job: Validate — pull sha tags from GHCR, verify ARM64, smoke check ─
  # Pulls immutable sha-<short> images from GHCR (pushed by build jobs).
  # Validates architecture and runs lightweight runtime checks.
  # Uses always() because build jobs may be skipped by change detection.
  validate:
    name: Validate images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-dev-base, build-kasmvnc, build-opencode, build-codenomad]
    if: |
      always() && (
        needs.build-dev-base.result == 'success' ||
        needs.build-kasmvnc.result == 'success' ||
        needs.build-opencode.result == 'success' ||
        needs.build-codenomad.result == 'success'
      )

    steps:
      - name: Set up QEMU for ARM64 runtime checks
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify architecture
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          FAILED=0

          pull_and_check() {
            local img="$1"
            local ghcr_img="ghcr.io/${GHCR_OWNER}/${img}:sha-${SHORT_SHA}"
            echo "::group::Validating ${img} (${ghcr_img})"

            if docker pull --platform linux/arm64 "${ghcr_img}" 2>/dev/null; then
              arch=$(docker image inspect --format '{{.Architecture}}' "${ghcr_img}" 2>/dev/null)
              if [[ "$arch" == "arm64" ]] || [[ "$arch" == "aarch64" ]]; then
                echo "✅ ${img}: ${arch}"
              else
                echo "❌ ${img}: arch = ${arch} (expected arm64)"
                FAILED=1
              fi
            else
              echo "⚠️  ${img}: pull failed — image may not have been built in this run"
              FAILED=1
            fi

            echo "::endgroup::"
          }

          if [[ "${{ needs.build-dev-base.result }}" == "success" ]]; then
            pull_and_check "dev-base"
          fi
          if [[ "${{ needs.build-kasmvnc.result }}" == "success" ]]; then
            pull_and_check "kasmvnc-workspace"
          fi
          if [[ "${{ needs.build-opencode.result }}" == "success" ]]; then
            pull_and_check "opencode-server"
          fi
          if [[ "${{ needs.build-codenomad.result }}" == "success" ]]; then
            pull_and_check "codenomad-server"
          fi

          if [[ $FAILED -gt 0 ]]; then
            echo "❌ ${FAILED} image(s) failed architecture validation"
            exit 1
          fi
          echo "✅ All pulled images pass architecture validation"

      - name: Runtime smoke checks
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          FAILED=0

          smoke() {
            local img="$1"
            local ghcr_img="ghcr.io/${GHCR_OWNER}/${img}:sha-${SHORT_SHA}"
            local cmd="$2"
            local expect="$3"

            if ! docker image inspect "${ghcr_img}" &>/dev/null; then
              echo "   ⏭  ${img} not pulled — skipping"
              return 0
            fi

            echo "::group::Smoke ${img}"
            output=$(docker run --rm --platform linux/arm64 --entrypoint bash "${ghcr_img}" -lc "${cmd}" 2>/dev/null || echo "RUNTIME_FAIL")
            if echo "$output" | grep -qE "${expect}"; then
              echo "   ✅ ${img}: ${output}"
            else
              echo "   ❌ ${img}: check failed (output: ${output})"
              FAILED=1
            fi
            echo "::endgroup::"
          }

          if [[ "${{ needs.build-dev-base.result }}" == "success" ]]; then
            smoke "dev-base" "git --version && node --version" "git version"
          fi
          if [[ "${{ needs.build-opencode.result }}" == "success" ]]; then
            smoke "opencode-server" "opencode --version" '[0-9]+\.[0-9]+\.[0-9]+'
          fi
          if [[ "${{ needs.build-codenomad.result }}" == "success" ]]; then
            smoke "codenomad-server" "opencode --version && codenomad --version" '[0-9]+\.[0-9]+\.[0-9]+'
          fi
          if [[ "${{ needs.build-kasmvnc.result }}" == "success" ]]; then
            smoke "kasmvnc-workspace" "uname -m" "aarch64"
          fi

          if [[ $FAILED -gt 0 ]]; then
            echo "❌ Runtime smoke validation failed"
            exit 1
          fi

  # ── Job: Promote images (runs AFTER validate passes) ────────────────────
  # Uses docker buildx imagetools create to attach latest + version tags
  # to the validated sha-<short> image. No layer re-push — pure tag alias.
  # Only runs on main branch (push, schedule, or workflow_dispatch targeting main).
  # Tags: latest, and version tags from ARG pins in Dockerfiles.
  promote-images:
    name: Promote images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-dev-base, build-kasmvnc, build-opencode, build-codenomad, validate]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    strategy:
      matrix:
        include:
          - name: dev-base
            dir: dev-base
          - name: kasmvnc-workspace
            dir: kasmvnc
          - name: opencode-server
            dir: opencode
          - name: codenomad-server
            dir: codenomad
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote ${{ matrix.name }}
        shell: bash
        run: |
          GHCR_BASE="ghcr.io/${GHCR_OWNER}"
          IMG_NAME="${{ matrix.name }}"
          SHA_TAG="${GHCR_BASE}/${IMG_NAME}:sha-${GITHUB_SHA::7}"

          echo "::group::Promote ${IMG_NAME}"

          if ! docker buildx imagetools inspect "${SHA_TAG}" &>/dev/null; then
            echo "⚠️  ${SHA_TAG} not found in GHCR — build was skipped, nothing to promote"
            echo "::endgroup::"
            exit 0
          fi

          TAG_ARGS="-t ${GHCR_BASE}/${IMG_NAME}:latest"

          DOCKERFILE="${{ matrix.dir }}/Dockerfile"
          if [[ -f "$DOCKERFILE" ]]; then
            while IFS='=' read -r arg_line value; do
              arg_name="${arg_line#ARG }"
              arg_name="${arg_name%% }"
              if [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                prefix="$(echo "${arg_name%_VERSION}" | tr '[:upper:]' '[:lower:]')"
                if [[ -n "$prefix" && "$prefix" != "$arg_name" ]]; then
                  TAG_ARGS="${TAG_ARGS} -t ${GHCR_BASE}/${IMG_NAME}:${prefix}-${value}"
                fi
              fi
            done < <(grep -E '^ARG [A-Z_]+=[0-9]+\.[0-9]+\.[0-9]+' "$DOCKERFILE" 2>/dev/null || true)
          fi

          echo "Tagging ${SHA_TAG} with: ${TAG_ARGS}"
          docker buildx imagetools create ${TAG_ARGS} "${SHA_TAG}"

          echo "✅ ${IMG_NAME} — promoted to latest and version tags"
          echo "::endgroup::"

  # ── Job: Notify Dokploy Compose webhook (non-fatal on failure) ──────────
  # Only runs after images are successfully promoted to GHCR.
  notify-dokploy:
    name: Notify Dokploy
    runs-on: ubuntu-latest
    needs: promote-images
    if: success()
    continue-on-error: true

    steps:
      - name: POST to Dokploy Compose webhook
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          echo "::group::Notify Dokploy Compose webhook"

          if [[ -z "$DOKPLOY_URL" ]]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL not configured — skipping"
            echo "::endgroup::"
            exit 0
          fi

          echo "Sending Compose webhook POST ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref }}"}' \
            "$DOKPLOY_URL" 2>/dev/null || echo "000")

          if [[ "$HTTP_STATUS" =~ ^[23] ]]; then
            echo "✅ Dokploy Compose webhook accepted (HTTP ${HTTP_STATUS})"
          else
            echo "::warning::Dokploy Compose webhook returned HTTP ${HTTP_STATUS} — deploy may not have triggered"
            echo "    This is non-fatal. The images are in GHCR and can be deployed manually via Dokploy UI."
          fi
          echo "::endgroup::"
