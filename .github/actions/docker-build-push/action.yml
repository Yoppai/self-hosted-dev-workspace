# .github/actions/docker-build-push/action.yml
# Self-Hosted Workspace — Docker Build & Push Composite Action
# ============================================================
# Builds ARM64 Docker images with BuildKit cache (mode=max), logs into GHCR,
# and pushes with latest, sha-<short>, and ARG version tags.
#
# Usage:
#   - name: Build and push
#     uses: ./.github/actions/docker-build-push
#     with:
#       dockerfile_path: opencode/Dockerfile
#       image_name: opencode-server
#       build_context: ./opencode
#
# The action auto-detects ARG version pins (e.g., ARG OPENCODE_VERSION=1.15.1)
# and adds additional tags like `opencode-1.15.1` when found.

name: 'Docker Build and Push'
description: 'Build ARM64 Docker image and push to GHCR with version tags'

inputs:
  dockerfile_path:
    description: 'Path to the Dockerfile'
    required: true
  image_name:
    description: 'Name of the image (e.g., opencode-server)'
    required: true
  build_context:
    description: 'Build context directory'
    required: true
  target_platform:
    description: 'Target platform (default: linux/arm64)'
    required: false
    default: 'linux/arm64'
  push:
    description: 'Push image to GHCR after build'
    required: false
    default: 'true'
  no-cache:
    description: 'Skip BuildKit cache and rebuild from scratch'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version tags from Dockerfile ARGs
      id: version_tags
      shell: bash
      run: |
        TAGS=""
        DOCKERFILE="${{ inputs.dockerfile_path }}"

        # Always add latest and sha-<short> tags
        GHCR_BASE="ghcr.io/${{ github.repository_owner }}"
        TAGS="${GHCR_BASE}/${{ inputs.image_name }}:latest"
        TAGS="${TAGS},${GHCR_BASE}/${{ inputs.image_name }}:sha-${GITHUB_SHA::7}"

        # Parse ARG lines that contain version pins (e.g., ARG OPENCODE_VERSION=1.15.1)
        # Format: ARG <PREFIX>_VERSION=<semver>
        if [[ -f "$DOCKERFILE" ]]; then
          while IFS='=' read -r arg_line value; do
            # Extract ARG name after 'ARG '
            arg_name="${arg_line#ARG }"
            arg_name="${arg_name%% }"
            # Check value looks like a version number
            if [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              # Convert name (e.g., OPENCODE_VERSION -> opencode)
              prefix="$(echo "${arg_name%_VERSION}" | tr '[:upper:]' '[:lower:]')"
              if [[ -n "$prefix" && "$prefix" != "$arg_name" ]]; then
                TAGS="${TAGS},${GHCR_BASE}/${{ inputs.image_name }}:${prefix}-${value}"
              fi
            fi
          done < <(grep -E '^ARG [A-Z_]+=[0-9]+\.[0-9]+\.[0-9]+' "$DOCKERFILE" 2>/dev/null || true)
        fi

        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        echo "::debug::Generated tags: ${TAGS}"

    - name: Resolve cache options
      id: cache
      shell: bash
      run: |
        if [[ "${{ inputs.no-cache }}" == "true" ]]; then
          echo "No-cache mode enabled — skipping BuildKit cache"
          echo "cache-from=" >> "$GITHUB_OUTPUT"
          echo "cache-to=" >> "$GITHUB_OUTPUT"
        else
          echo "cache-from=type=gha" >> "$GITHUB_OUTPUT"
          echo "cache-to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.build_context }}
        file: ${{ inputs.dockerfile_path }}
        platforms: ${{ inputs.target_platform }}
        tags: ${{ steps.version_tags.outputs.tags }}
        push: ${{ inputs.push }}
        load: true
        provenance: false
        cache-from: ${{ steps.cache.outputs.cache-from }}
        cache-to: ${{ steps.cache.outputs.cache-to }}
