# .github/actions/docker-build-push/action.yml
# Self-Hosted Workspace — Docker Build & Push Composite Action
# ============================================================
# Cross-platform ARM64 build via QEMU + buildx. Logs into GHCR, builds with
# BuildKit cache (mode=max), and pushes the resulting image.
#
# Tag strategy (all controlled via inputs):
#   sha-<short>  — always included (immutable, used for validation)
#   latest       — included when include-latest-tag is true
#   <prefix>-<v> — included when include-version-tags is true (from Dockerfile ARGs)
#
# Usage (push only sha tag, for CI build → validate → promote flow):
#   uses: ./.github/actions/docker-build-push
#   with:
#     dockerfile_path: opencode/Dockerfile
#     image_name: opencode-server
#     build_context: ./opencode
#     push: true
#     include-latest-tag: false
#     include-version-tags: false
#
# Usage (full tags, for local/dev use):
#   uses: ./.github/actions/docker-build-push
#   with:
#     dockerfile_path: opencode/Dockerfile
#     image_name: opencode-server
#     build_context: ./opencode

name: 'Docker Build and Push'
description: 'Cross-platform Docker build (QEMU + buildx) and push to GHCR'

inputs:
  dockerfile_path:
    description: 'Path to the Dockerfile'
    required: true
  image_name:
    description: 'Name of the image (e.g., opencode-server)'
    required: true
  build_context:
    description: 'Build context directory'
    required: true
  target_platform:
    description: 'Target platform (default: linux/arm64)'
    required: false
    default: 'linux/arm64'
  push:
    description: 'Push image to GHCR after build'
    required: false
    default: 'true'
  load:
    description: 'Load image into local Docker daemon (incompatible with push)'
    required: false
    default: 'false'
  no-cache:
    description: 'Skip BuildKit cache and rebuild from scratch'
    required: false
    default: 'false'
  include-latest-tag:
    description: 'Include latest tag (default: true)'
    required: false
    default: 'true'
  include-version-tags:
    description: 'Include version tags from Dockerfile ARGs (default: true)'
    required: false
    default: 'true'
  setup-qemu:
    description: 'Set up QEMU for cross-platform emulation (default: true)'
    required: false
    default: 'true'
  registry-token:
    description: 'Token for GHCR authentication'
    required: true
  build-contexts:
    description: 'Additional BuildKit build contexts (newline-separated)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up QEMU for cross-platform emulation
      if: ${{ inputs.setup-qemu == 'true' }}
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.registry-token }}

    - name: Extract image tags
      id: version_tags
      shell: bash
      run: |
        DOCKERFILE="${{ inputs.dockerfile_path }}"
        GHCR_OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
        GHCR_BASE="ghcr.io/${GHCR_OWNER}"

        # Always include the immutable sha-<short> tag
        TAGS="${GHCR_BASE}/${{ inputs.image_name }}:sha-${GITHUB_SHA::7}"

        if [[ "${{ inputs.include-latest-tag }}" == "true" ]]; then
          TAGS="${TAGS},${GHCR_BASE}/${{ inputs.image_name }}:latest"
        fi

        if [[ "${{ inputs.include-version-tags }}" == "true" && -f "$DOCKERFILE" ]]; then
          while IFS='=' read -r arg_line value; do
            arg_name="${arg_line#ARG }"
            arg_name="${arg_name%% }"
            if [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              prefix="$(echo "${arg_name%_VERSION}" | tr '[:upper:]' '[:lower:]')"
              if [[ -n "$prefix" && "$prefix" != "$arg_name" ]]; then
                TAGS="${TAGS},${GHCR_BASE}/${{ inputs.image_name }}:${prefix}-${value}"
              fi
            fi
          done < <(grep -E '^ARG [A-Z_]+=[0-9]+\.[0-9]+\.[0-9]+' "$DOCKERFILE" 2>/dev/null || true)
        fi

        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        echo "::debug::Generated tags: ${TAGS}"

    - name: Resolve cache options
      id: cache
      shell: bash
      run: |
        if [[ "${{ inputs.no-cache }}" == "true" ]]; then
          echo "No-cache mode enabled — skipping BuildKit cache"
          echo "cache-from=" >> "$GITHUB_OUTPUT"
          echo "cache-to=" >> "$GITHUB_OUTPUT"
        else
          echo "cache-from=type=gha" >> "$GITHUB_OUTPUT"
          echo "cache-to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.build_context }}
        file: ${{ inputs.dockerfile_path }}
        platforms: ${{ inputs.target_platform }}
        tags: ${{ steps.version_tags.outputs.tags }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        build-contexts: ${{ inputs.build-contexts }}
        provenance: false
        cache-from: ${{ steps.cache.outputs.cache-from }}
        cache-to: ${{ steps.cache.outputs.cache-to }}
